<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeJEPA Lens</title>
<style>
  :root { --bg: #0f1115; --fg: #e8e8ea; --dim: #9aa0aa; --acc: #ffd166; --card: #1a1d24; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 12px 16px 24px; }
  p { margin: 6px 0; color: var(--dim); }
  #stage { position: relative; width: 100%; aspect-ratio: 1; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 10px; background: #000; touch-action: none; }
  .row { display: flex; gap: 8px; margin: 10px 0; align-items: center; }
  button { flex: 1; padding: 10px 6px; border: 0; border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; }
  button.on { background: var(--acc); color: #111; font-weight: 600; }
  #fs { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; padding: 8px; background: rgba(0, 0, 0, .45); color: #fff; }
  #fs svg { display: block; width: 100%; height: 100%; }
  #status { font-size: 13px; font-variant-numeric: tabular-nums; }
  video { display: none; }
  /* landscape: the picture fits the visible height, controls sit beside it */
  @media (orientation: landscape) {
    main { max-width: none; display: flex; gap: 16px; align-items: flex-start; padding: 8px 12px; }
    #stage { width: min(calc(100vh - 16px), 60vw); width: min(calc(100dvh - 16px), 60vw); flex: none; }
    #side { flex: 1; min-width: 0; }
    #modes { margin-top: 0; }
  }
  /* a phone held sideways: a wide picture (top and bottom of the square are cropped) */
  @media (orientation: landscape) and (max-height: 500px) {
    #stage { aspect-ratio: 16 / 9; width: min(72vw, calc((100vh - 16px) * 16 / 9)); width: min(72vw, calc((100dvh - 16px) * 16 / 9)); }
  }
</style>
</head>
<body>
<main>
  <div id="stage">
    <canvas id="view" width="448" height="448"></canvas>
    <button id="fs" aria-label="Full screen"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 7V2h5M13 2h5v5M18 13v5h-5M7 18H2v-5"/></svg></button>
  </div>
  <div id="side">
    <div class="row" id="modes">
      <button data-mode="colors" class="on">Colors</button>
      <button data-mode="touch">Touch</button>
      <button data-mode="focus">Focus</button>
    </div>
    <div class="row"><button id="lock">Lock colors</button></div>
    <p id="status">Starting…</p>
    <p>Everything runs on your device. No image leaves it.<br>
       Model: LeJEPA ViT-S/16, a third-party reproduction by OK-AI (Apache-2.0).</p>
  </div>
  <video id="video" playsinline muted></video>
</main>

<script type="module">
const ORT = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/";
const qs = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const view = $("view"), vctx = view.getContext("2d");
const small = document.createElement("canvas"), sctx = small.getContext("2d", { willReadFrequently: true });
const ov = document.createElement("canvas"), octx = ov.getContext("2d");
const prev = document.createElement("canvas"), pctx = prev.getContext("2d");   // the map before the current one
const mix = document.createElement("canvas"), mctx = mix.getContext("2d");     // cross-fade of the two
const PS = 16, D = 384;
const CHECKS = { 224: [0, 27, 52, 77, 97, 122, 150, 195], 160: [0, 13, 27, 38, 52, 64, 77, 99], 128: [0, 9, 18, 27, 36, 45, 54, 63] };
const SIZE_MB = { gpu: 43, q8: 23 };

const state = window.demo = { mode: "colors", backend: "", ms: 0, fps: 0, frames: 0, locked: false, check: null, res: 0, note: "", threads: 0 };
let run = null, src = null, query = null, hasMap = false, hasPrev = false, fadeT0 = 0, fadeMs = 0;
const setStatus = t => { $("status").textContent = t; };
const saved = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } };

// ---------- input size
// R is the model's square input in pixels, G the patches per side, N the patch count. Everything sized
// by them is (re)allocated here: the GPU and CPU paths may use different sizes.
let R, G, N, CHECK, od, input, pm, Xc, proj, Y, T, A, TAPER, y0, bandH, pcaReady, focusReady;
const wideQ = matchMedia("(orientation: landscape) and (max-height: 500px)");
function layout() {
  // the model always sees a centred square; a phone held sideways shows the middle band of it (16:9)
  bandH = wideQ.matches ? R * 9 / 16 : R;
  y0 = (R - bandH) / 2;
  view.width = wideQ.matches ? 640 : 448;
  view.height = wideQ.matches ? 360 : 448;
}
wideQ.addEventListener("change", layout);
function setup(res) {
  R = state.res = res; G = R / PS; N = G * G; CHECK = CHECKS[R];
  small.width = small.height = ov.width = ov.height = prev.width = prev.height = mix.width = mix.height = R;
  od = octx.createImageData(R, R);
  input = new Float32Array(3 * R * R);
  pm = new Float32Array(N * 3); Xc = new Float32Array(N * D); proj = new Float32Array(N);
  Y = new Float32Array(N * 3); T = new Float32Array(N); A = new Float32Array(N);
  // border patches attract attention whatever the scene shows, so Focus damps them
  TAPER = Float32Array.from({ length: N }, (_, i) => {
    const y = (i / G) | 0, x = i % G, ey = y === 0 || y === G - 1, ex = x === 0 || x === G - 1;
    return ey && ex ? 0.25 : ey || ex ? 0.5 : 1;
  });
  pcaReady = focusReady = hasMap = hasPrev = false;
  query = null;
  layout();
}
const mobile = navigator.userAgentData ? navigator.userAgentData.mobile : /Android|iPhone|iPad/.test(navigator.userAgent);
const forced = +qs.get("res") in CHECKS ? +qs.get("res") : 0;      // ?res=224|160|128
const RES_GPU = forced === 224 || forced === 160 ? forced : mobile ? 160 : 224, RES_CPU = forced || (mobile ? 128 : 224);
setup(RES_GPU);

// ---------- model
async function fetchBytes(url, mb) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  const reader = r.body.getReader(), chunks = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    // the size is hard-coded: a compressed transfer reports its compressed length, not the file's
    setStatus(`Loading model: ${Math.min(mb, Math.round(got / 1e6))} / ${mb} MB`);
  }
  const out = new Uint8Array(got);
  let o = 0;
  for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}

// Run a fixed synthetic pattern and compare with reference features (check_<size>.bin, made by export.py).
// Returns the mean cosine of mean-centred features over 8 patches, or null if there is no reference.
async function fidelity(fn) {
  const r = await fetch(`check_${R}.bin`);
  if (!r.ok) return null;
  const ref = new Float32Array(await r.arrayBuffer()), x = new Float32Array(3 * R * R), K = CHECK.length;
  for (let c = 0; c < 3; c++) for (let y = 0; y < R; y++) for (let xx = 0; xx < R; xx++)
    x[c * R * R + y * R + xx] = 0.5 + 0.25 * Math.sin(xx * 0.11 + c * 1.3) + 0.25 * Math.cos(y * 0.07 * (c + 1));
  const f = (await fn(x)).feat;
  const mf = new Float32Array(D), mr = new Float32Array(D);
  for (let k = 0; k < K; k++) for (let j = 0; j < D; j++) { mf[j] += f[CHECK[k] * D + j] / K; mr[j] += ref[k * D + j] / K; }
  let tot = 0;
  for (let k = 0; k < K; k++) {
    let s = 0, a = 0, b = 0;
    for (let j = 0; j < D; j++) { const u = f[CHECK[k] * D + j] - mf[j], v = ref[k * D + j] - mr[j]; s += u * v; a += u * u; b += v * v; }
    tot += s / Math.sqrt(a * b);
  }
  return tot / K;
}

// An engine is an async function: Float32Array image -> { feat, attn }.
let ortGpu = null;
async function loadOrtGpu() {
  if (!ortGpu) { ortGpu = await import(ORT + "ort.webgpu.min.mjs"); ortGpu.env.wasm.wasmPaths = ORT; }
  return ortGpu;
}
// GPUs differ in which operations they get right (an Adreno got the attention matrix product wrong).
// A probe is the attention core without weights, a few kB: it runs on the CPU and on the GPU with the
// same input, and the full model is only downloaded in a form whose probe the GPU computes correctly.
const KINDS = ["matmul", "einsum", "mulsum"];
async function probe(kind) {
  const ort = await loadOrtGpu(), r = await fetch(`probe_${kind}_${R}.onnx`);
  if (!r.ok) return false;
  const bytes = new Uint8Array(await r.arrayBuffer());
  const n = N + 1 + (4 - (N + 1) % 4) % 4, x = new Float32Array(n * 1152);
  let seed = 12345;
  for (let k = 0; k < x.length; k++) { seed = (seed * 1664525 + 1013904223) >>> 0; x[k] = 3 * seed / 4294967296 - 1.5; }
  const once = async ep => {
    const s = await ort.InferenceSession.create(bytes.slice(), { executionProviders: [ep] });
    const y = Float32Array.from((await s.run({ x: new ort.Tensor("float32", x, [1, n, 1152]) })).y.data);
    await s.release();
    return y;
  };
  const a = await once("wasm"), b = await once("webgpu");
  let num = 0, den = 0;
  for (let k = 0; k < a.length; k++) { num += (a[k] - b[k]) ** 2; den += a[k] ** 2; }
  return Math.sqrt(num / den) < 1e-3;
}
async function gpuEngine(bytes) {
  const ort = await loadOrtGpu();
  const s = await ort.InferenceSession.create(bytes, { executionProviders: ["webgpu"] });
  const fn = async x => {
    const o = await s.run({ image: new ort.Tensor("float32", x, [1, 3, R, R]) });
    return { feat: o.feat.data, attn: o.attn.data };
  };
  fn.release = () => s.release();
  return fn;
}
// The CPU path runs in worker.js, so the page keeps drawing the camera while the model computes.
function wasmEngine(bytes, threads) {
  return new Promise((res, rej) => {
    const w = new Worker("worker.js", { type: "module" });
    let pending = null;
    const fn = x => new Promise((ok, no) => { pending = { ok, no }; w.postMessage({ type: "run", input: x, size: R }); });
    fn.release = () => w.terminate();
    w.onmessage = e => {
      const m = e.data;
      if (m.type === "ready") res(fn);
      else if (m.type === "out") pending.ok(m);
      else (pending ? pending.no : rej)(new Error(m.message));
    };
    w.onerror = e => rej(new Error(e.message || "worker failed to start"));
    w.postMessage({ type: "init", bytes, threads }, [bytes.buffer]);
  });
}
// More threads are not always faster on a phone, so the first visit times 1, 2 and 4 and keeps the best.
const THREADS_KEY = "lens.threads.v1";
async function tunedWasmEngine(bytes) {
  const max = crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 1) : 1;
  const cands = [1, 2, 4].filter(t => t <= max), known = +(qs.get("threads") || saved(THREADS_KEY));
  if (cands.length === 1 || cands.includes(known)) {
    state.threads = cands.includes(known) ? known : 1;
    return wasmEngine(bytes, state.threads);
  }
  const x = new Float32Array(3 * R * R).fill(0.5);
  let best = null;
  for (const t of cands) {
    setStatus(`Tuning for this device: ${t} thread${t > 1 ? "s" : ""}…`);
    const fn = await wasmEngine(bytes.slice(), t);
    await fn(x);                                            // warm-up
    const t0 = performance.now();
    await fn(x); await fn(x);
    const ms = (performance.now() - t0) / 2;
    if (!best || ms < best.ms * 0.9) { if (best) best.fn.release(); best = { fn, ms, t }; } else fn.release();
  }
  state.threads = best.t;
  save(THREADS_KEY, String(best.t));
  return best.fn;
}
// A device whose GPU failed the check is remembered, so later visits skip that download (?ep=webgpu retries).
const GPU_KEY = "lens.gpu.v4";

async function createEngine() {
  const want = qs.get("ep");
  if (!navigator.gpu) state.note = "no gpu";
  else if (want === "wasm") state.note = "gpu skipped";
  else if (want !== "webgpu" && saved(GPU_KEY)) state.note = `gpu skipped, earlier: ${saved(GPU_KEY)}`;
  else {
    let fn = null, verdict = true;                 // verdict: the failure is a property of this GPU
    try {
      setStatus("Checking the GPU…");
      let kind = null;
      for (const k of qs.get("kind") ? [qs.get("kind")] : KINDS) {
        if (k !== "matmul" && R !== 160) setup(160);          // the alternative forms exist at 160 px only
        if (await probe(k)) { kind = k; break; }
      }
      if (!kind) throw new Error("no attention form is computed correctly");
      // the GPU models use only basic operations and 32-bit arithmetic
      verdict = false;
      const bytes = await fetchBytes(`model_gpu_${kind}_${R}.onnx`, SIZE_MB.gpu);
      verdict = true;
      setStatus("Preparing model…");
      fn = await gpuEngine(bytes);
      state.check = await fidelity(fn);
      state.note = `gpu ${kind} check ${state.check === null ? "n/a" : state.check.toFixed(3)}`;
      if (state.check === null || state.check >= 0.95) return [fn, "WebGPU"];
    } catch (e) { state.note = `gpu error: ${e.message}`; }
    console.warn("WebGPU not usable, falling back to WASM:", state.note);
    if (fn) fn.release();
    if (verdict) save(GPU_KEY, state.note);
  }
  setup(RES_CPU);
  const bytes = await fetchBytes(`model_q8_${R}.onnx`, SIZE_MB.q8);
  setStatus("Preparing model…");
  return [await tunedWasmEngine(bytes), "WASM"];
}

// ---------- source
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 640 } }, audio: false });
  const v = $("video");
  v.srcObject = stream;
  await v.play();
  src = v;
}
const useImage = url => new Promise((res, rej) => {
  const im = new Image();
  im.onload = () => { src = im; res(); };
  im.onerror = () => rej(new Error("image failed to load"));
  im.src = url;
});
function drawSource(ctx, sy, sh, dw, dh) {
  // sy, sh: band of the centred square, as fractions of its side (state.pan shifts the view, for testing)
  const w = src.videoWidth || src.naturalWidth, h = src.videoHeight || src.naturalHeight, s = Math.min(w, h);
  ctx.drawImage(src, (w - s) / 2 + (state.pan || 0) * s, (h - s) / 2 + s * sy, s, s * sh, 0, 0, dw, dh);
}

// ---------- motion tracking
// A map describes the frame the model started from, about one inference ago. To keep it on the objects
// while the camera moves, the page measures how far the live picture has shifted since that frame
// (on 48x48 thumbnails) and draws the map displaced by the same amount.
const TH = 48, MAXS = 16;
const thumb = document.createElement("canvas"); thumb.width = thumb.height = TH;
const tctx = thumb.getContext("2d", { willReadFrequently: true });
tctx.imageSmoothingQuality = "medium";
const refT = new Float32Array(TH * TH), capT = new Float32Array(TH * TH);
let shift = [0, 0], curShift0 = [0, 0], prevShift0 = [0, 0];   // in thumbnail pixels
function grabThumb(out, canvas) {               // zero-mean brightness of a square frame
  tctx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, TH, TH);
  const d = tctx.getImageData(0, 0, TH, TH).data;
  let m = 0;
  for (let i = 0; i < TH * TH; i++) { out[i] = 0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2]; m += out[i]; }
  m /= TH * TH;
  for (let i = 0; i < TH * TH; i++) out[i] -= m;
}
function sad(ref, cur, dx, dy) {                // mean |cur(x + dx, y + dy) - ref(x, y)| over the overlap
  const xa = Math.max(0, -dx), xb = Math.min(TH, TH - dx), ya = Math.max(0, -dy), yb = Math.min(TH, TH - dy);
  let s = 0;
  for (let y = ya; y < yb; y++) {
    const r = y * TH, c = (y + dy) * TH + dx;
    for (let x = xa; x < xb; x++) s += Math.abs(cur[c + x] - ref[r + x]);
  }
  return s / ((xb - xa) * (yb - ya));
}
function estimateShift(ref, cur, gx, gy, rad = 3) {   // search around the guess, then refine below one pixel
  const cx = Math.round(gx), cy = Math.round(gy);
  let best = Infinity, bx = 0, by = 0;
  for (let dy = cy - rad; dy <= cy + rad; dy++) for (let dx = cx - rad; dx <= cx + rad; dx++) {
    if (Math.abs(dx) > MAXS || Math.abs(dy) > MAXS) continue;
    const s = sad(ref, cur, dx, dy);
    if (s < best) { best = s; bx = dx; by = dy; }
  }
  if (best === Infinity) return [Math.max(-MAXS, Math.min(MAXS, gx)), Math.max(-MAXS, Math.min(MAXS, gy))];
  const sub = (a, c) => { const den = a - 2 * best + c; return den > 1e-6 ? Math.max(-0.5, Math.min(0.5, 0.5 * (a - c) / den)) : 0; };
  const fx = Math.abs(bx) < MAXS ? sub(sad(ref, cur, bx - 1, by), sad(ref, cur, bx + 1, by)) : 0;
  const fy = Math.abs(by) < MAXS ? sub(sad(ref, cur, bx, by - 1), sad(ref, cur, bx, by + 1)) : 0;
  return [bx + fx, by + fy];
}
state.estimateShift = estimateShift;            // exposed for tests

// ---------- delayed preview
// A map needs about one inference to arrive. Showing the camera that much late means the map appears
// on exactly the frame it was computed from; motion tracking then only has to cover the time until
// the next map. Recent frames are kept in a ring, each with its thumbnail.
const RS = 448, RING = 24;
const ring = Array.from({ length: RING }, () => {
  const c = document.createElement("canvas");
  c.width = c.height = RS;
  return { c, ctx: c.getContext("2d"), t: -1, th: new Float32Array(TH * TH) };
});
let head = 0, delay = 0, fresh = false;
function pushFrame(now) {
  head = (head + 1) % RING;
  const f = ring[head];
  drawSource(f.ctx, 0, 1, RS, RS);
  grabThumb(f.th, f.c);
  f.t = now;
  return f;
}
function frameAt(t) {                           // the kept frame closest to time t
  let best = ring[head];
  for (const f of ring) if (f.t >= 0 && Math.abs(f.t - t) < Math.abs(best.t - t)) best = f;
  return best;
}

// ---------- maths
const dot = (a, b) => { let s = 0; for (let j = 0; j < D; j++) s += a[j] * b[j]; return s; };
const normalize = a => { const n = Math.sqrt(dot(a, a)) || 1; for (let j = 0; j < D; j++) a[j] /= n; };
const clamp01 = t => t < 0 ? 0 : t > 1 ? 1 : t;
const STOPS = [[0, 0, 4], [87, 16, 110], [188, 55, 84], [249, 142, 9], [252, 255, 164]];
function heat(t, o, alpha) {
  const x = clamp01(t) * 4, k = Math.min(3, x | 0), f = x - k, a = STOPS[k], b = STOPS[k + 1];
  od.data[o] = a[0] + (b[0] - a[0]) * f; od.data[o + 1] = a[1] + (b[1] - a[1]) * f;
  od.data[o + 2] = a[2] + (b[2] - a[2]) * f; od.data[o + 3] = 255 * alpha;
}

// Edge-aware upsampling (joint bilateral): each pixel takes the value of nearby patches whose
// average color resembles the pixel, so the patch map follows the edges of the camera image.
// The spatial weight is a quadratic B-spline: it falls to zero at the edge of the 3x3 neighbourhood,
// so the result has no seams along patch borders.
const WS = new Float32Array(PS * PS * 9), WR = new Float32Array(1024), WR_SOFT = new Float32Array(1024);
const bspline = t => { t = Math.abs(t); return t <= 0.5 ? 0.75 - t * t : t <= 1.5 ? 0.5 * (1.5 - t) ** 2 : 0; };
for (let fy = 0; fy < PS; fy++) for (let fx = 0; fx < PS; fx++) for (let dy = -1, k = 0; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++, k++)
  WS[(fy * PS + fx) * 9 + k] = bspline((fy + 0.5) / PS - 0.5 - dy) * bspline((fx + 0.5) / PS - 0.5 - dx);
for (let i = 0; i < 1024; i++) {
  WR[i] = Math.exp(-(i * 64 + 32) / 1872.7);        // color sigma = 0.12 of full range: follows edges closely
  WR_SOFT[i] = Math.exp(-(i * 64 + 32) / 15930);    // color sigma = 0.35: mostly smooth, for the Focus glow
}
function patchMeans(px) {
  pm.fill(0);
  for (let y = 0; y < R; y++) for (let x = 0; x < R; x++) {
    const p = ((y >> 4) * G + (x >> 4)) * 3, o = (y * R + x) * 4;
    pm[p] += px[o]; pm[p + 1] += px[o + 1]; pm[p + 2] += px[o + 2];
  }
  for (let i = 0; i < N * 3; i++) pm[i] /= PS * PS;
}
function upsample(vals, C, px, write, wr = WR) {
  for (let y = Math.floor(y0), ye = Math.ceil(y0 + bandH); y < ye; y++) {   // only the rows on screen
    const cy = y >> 4, fy = y & 15;
    for (let x = 0; x < R; x++) {
      const cx = x >> 4, o = (y * R + x) * 4, r = px[o], g = px[o + 1], b = px[o + 2];
      let s0 = 0, s1 = 0, s2 = 0, den = 0, wi = (fy * PS + (x & 15)) * 9;
      for (let dy = -1; dy <= 1; dy++) {
        const qy = cy + dy < 0 ? 0 : cy + dy > G - 1 ? G - 1 : cy + dy;
        for (let dx = -1; dx <= 1; dx++, wi++) {
          const qx = cx + dx < 0 ? 0 : cx + dx > G - 1 ? G - 1 : cx + dx, q = qy * G + qx, m = q * 3;
          const dr = (r - pm[m]) ** 2 + (g - pm[m + 1]) ** 2 + (b - pm[m + 2]) ** 2;
          const w = WS[wi] * (wr[Math.min(1023, dr >> 6)] + 1e-4);
          den += w; s0 += w * vals[q * C];
          if (C === 3) { s1 += w * vals[q * C + 1]; s2 += w * vals[q * C + 2]; }
        }
      }
      write(o, s0 / den, s1 / den, s2 / den);
    }
  }
}

// PCA basis tracked by warm-started power iteration, so colors drift slowly instead of flipping
const mu = new Float32Array(D), V = [0, 1, 2].map(() => Float32Array.from({ length: D }, () => Math.random() - 0.5));
const lo = new Float32Array(3), hi = new Float32Array(3), tmp = new Float32Array(D);
function center(feat) {
  for (let i = 0; i < N; i++) for (let j = 0; j < D; j++) Xc[i * D + j] = feat[i * D + j] - mu[j];
}
function updateBasis(feat) {
  const b = pcaReady ? 0.1 : 1, a = pcaReady ? 0.2 : 1, iters = pcaReady ? 1 : 20;
  tmp.fill(0);
  for (let i = 0; i < N; i++) for (let j = 0; j < D; j++) tmp[j] += feat[i * D + j];
  for (let j = 0; j < D; j++) mu[j] += b * (tmp[j] / N - mu[j]);
  center(feat);
  for (let k = 0; k < 3; k++) for (let it = 0; it < iters; it++) {
    const v = V[k];
    for (let i = 0; i < N; i++) { let s = 0; for (let j = 0; j < D; j++) s += Xc[i * D + j] * v[j]; proj[i] = s; }
    tmp.fill(0);
    for (let i = 0; i < N; i++) { const p = proj[i]; for (let j = 0; j < D; j++) tmp[j] += Xc[i * D + j] * p; }
    normalize(tmp);
    for (let j = 0; j < D; j++) v[j] = (1 - a) * v[j] + a * tmp[j];
    for (let m = 0; m < k; m++) { const d = dot(v, V[m]); for (let j = 0; j < D; j++) v[j] -= d * V[m][j]; }
    normalize(v);
  }
}
function colors(feat, px) {
  const first = !pcaReady;
  if (!state.locked || first) updateBasis(feat); else center(feat);
  for (let k = 0; k < 3; k++) {
    let m = 0, q = 0;
    for (let i = 0; i < N; i++) {
      let s = 0;
      for (let j = 0; j < D; j++) s += Xc[i * D + j] * V[k][j];
      Y[i * 3 + k] = s; m += s; q += s * s;
    }
    m /= N;
    const sd = Math.sqrt(Math.max(q / N - m * m, 1e-12));
    if (!state.locked || first) {
      const b = first ? 1 : 0.1;
      lo[k] += b * (m - 2 * sd - lo[k]); hi[k] += b * (m + 2 * sd - hi[k]);
    }
  }
  pcaReady = true;
  for (let i = 0; i < N; i++) for (let k = 0; k < 3; k++) Y[i * 3 + k] = clamp01((Y[i * 3 + k] - lo[k]) / (hi[k] - lo[k]));
  upsample(Y, 3, px, (o, r, g, b) => {
    od.data[o] = 255 * r; od.data[o + 1] = 255 * g; od.data[o + 2] = 255 * b; od.data[o + 3] = 191;
  });
}
function touch(feat, px) {
  if (!query) { od.data.fill(0); return; }
  for (let i = 0; i < N; i++) {
    let s = 0, n = 0;
    for (let j = 0; j < D; j++) { const f = feat[i * D + j]; s += f * query[j]; n += f * f; }
    T[i] = clamp01((s / Math.sqrt(n) - 0.35) / 0.5);
  }
  // spotlight: similar regions stay lit, the rest is dimmed
  upsample(T, 1, px, (o, t) => { od.data[o] = od.data[o + 1] = od.data[o + 2] = 0; od.data[o + 3] = 230 * (1 - t); });
}
// The attention map is scored against its own spread: a scene with nothing salient stays dark
// instead of amplifying noise.
function focus(attn, px) {
  let m = 0, v = 0;
  for (let i = 0; i < N; i++) { A[i] = attn[i] * TAPER[i]; m += A[i]; }
  m /= N;
  for (let i = 0; i < N; i++) v += (A[i] - m) ** 2;
  const sd = Math.sqrt(v / N) || 1;
  for (let i = 0; i < N; i++) {
    const t = clamp01(((A[i] - m) / sd - 1.5) / 3.5);
    T[i] = focusReady ? 0.5 * T[i] + 0.5 * t : t;          // light smoothing over time
  }
  focusReady = true;
  // a soft glow: smooth between patches, only loosely tied to the image's edges
  upsample(T, 1, px, (o, t) => { t = Math.min(1, 1.4 * t); heat(0.25 + 0.75 * t, o, Math.sqrt(t) * 0.9); }, WR_SOFT);
}

// ---------- frames
// Every animation frame stores the camera picture, then shows the one from `delay` ago with the map
// the model last produced on top.
function draw(now) {
  if (src) {
    if (now - ring[head].t > 12) pushFrame(now);            // at most about 60 stored frames a second
    const f = delay ? frameAt(now - delay) : ring[head];
    vctx.drawImage(f.c, 0, RS * y0 / R, RS, RS * bandH / R, 0, 0, view.width, view.height);
    if (hasMap) {
      // follow the camera: how far is this frame from the one the map was computed from?
      shift = fresh ? estimateShift(refT, f.th, 0, 0, 6) : estimateShift(refT, f.th, shift[0], shift[1]);
      if (fresh) { curShift0 = shift; fresh = false; }
      state.shift = shift;
      const k = R / TH;
      // cross-fade from the previous map over about one inference interval, so updates do not pop
      const a = hasPrev && fadeMs ? Math.min(1, (performance.now() - fadeT0) / fadeMs) : 1;
      let top = ov;
      if (a < 1) {
        mctx.globalCompositeOperation = "copy"; mctx.globalAlpha = 1 - a;
        mctx.drawImage(prev, (prevShift0[0] - curShift0[0]) * k, (prevShift0[1] - curShift0[1]) * k);
        mctx.globalCompositeOperation = "lighter"; mctx.globalAlpha = a; mctx.drawImage(ov, 0, 0);
        top = mix;
      }
      vctx.imageSmoothingEnabled = true;
      vctx.drawImage(top, -shift[0] * k, y0 - shift[1] * k, R, bandH, 0, 0, view.width, view.height);
    }
  }
  requestAnimationFrame(draw);
}
// Between results the loop yields for one task (not a whole animation frame); it sleeps while the tab is hidden.
const tick = () => document.hidden
  ? new Promise(r => document.addEventListener("visibilitychange", r, { once: true }))
  : new Promise(r => setTimeout(r, 0));
async function inferLoop() {
  let last = 0;
  for (;;) {
    // the newest stored frame is the model's input (store one now if the preview is not running)
    let f = ring[head];
    if (f.t < 0 || performance.now() - f.t > 100) f = pushFrame(performance.now());
    const tc = f.t;
    capT.set(f.th);                             // kept as the next map's reference
    sctx.drawImage(f.c, 0, 0, RS, RS, 0, 0, R, R);
    const px = sctx.getImageData(0, 0, R, R).data, n = R * R;
    for (let i = 0; i < n; i++) { input[i] = px[4 * i] / 255; input[n + i] = px[4 * i + 1] / 255; input[2 * n + i] = px[4 * i + 2] / 255; }
    const t0 = performance.now();
    const { feat, attn } = await run(input);
    const t1 = performance.now();
    state.ms = state.frames ? 0.8 * state.ms + 0.2 * (t1 - t0) : t1 - t0;
    const gap = last ? t1 - last : 0;
    if (gap) state.fps = state.fps ? 0.8 * state.fps + 0.2 * 1000 / gap : 1000 / gap;
    last = t1;
    state.frames++;
    state.feat = feat;

    patchMeans(px);
    if (state.mode === "colors") colors(feat, px);
    else if (state.mode === "touch") touch(feat, px);
    else focus(attn, px);
    if (hasMap) { pctx.globalCompositeOperation = "copy"; pctx.drawImage(ov, 0, 0); hasPrev = true; }
    prevShift0 = shift;
    refT.set(capT);
    octx.putImageData(od, 0, 0);
    // the preview runs this far behind, so the map appears on the very frame it was computed from
    const t2 = performance.now();
    delay = Math.min(300, delay ? 0.8 * delay + 0.2 * (t2 - tc) : t2 - tc);
    fresh = true;
    fadeT0 = t2; fadeMs = Math.min(100, gap);
    hasMap = true;
    const dbg = qs.get("debug") ? ` · ${R}px · ${state.note} · threads ${state.threads} · delay ${delay.toFixed(0)}` : "";
    setStatus(`${state.backend} · ${state.ms.toFixed(0)} ms/frame · ${state.fps.toFixed(1)} fps${dbg}`);
    await tick();
  }
}

// ---------- UI
function setMode(m) {
  state.mode = m;
  for (const b of $("modes").children) b.classList.toggle("on", b.dataset.mode === m);
  $("lock").parentElement.style.display = m === "colors" ? "" : "none";
  focusReady = false;
  hasMap = hasPrev = false;   // hide the previous mode's map until the next result
}
$("modes").addEventListener("click", e => { if (e.target.dataset.mode) setMode(e.target.dataset.mode); });
$("lock").addEventListener("click", () => {
  state.locked = !state.locked;
  $("lock").classList.toggle("on", state.locked);
});
view.addEventListener("pointerdown", e => {
  if (state.mode !== "touch" || !state.feat) return;
  const r = view.getBoundingClientRect();
  const gx = Math.min(G - 1, Math.floor((e.clientX - r.left) / r.width * G));
  const gy = Math.min(G - 1, Math.floor((y0 + (e.clientY - r.top) / r.height * bandH) / PS));
  query = Float32Array.from(state.feat.subarray((gy * G + gx) * D, (gy * G + gx + 1) * D));
  normalize(query);
});
// full screen hides the address bar; browsers only allow it from a tap
const FS_ICON = { enter: "M2 7V2h5M13 2h5v5M18 13v5h-5M7 18H2v-5", exit: "M7 2v5H2M18 7h-5V2M13 18v-5h5M2 13h5v5" };
if (document.documentElement.requestFullscreen) {
  $("fs").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(e => console.warn(e));
  });
  document.addEventListener("fullscreenchange", () => {
    const on = !!document.fullscreenElement;
    $("fs").querySelector("path").setAttribute("d", on ? FS_ICON.exit : FS_ICON.enter);
    $("fs").setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
  });
} else $("fs").style.display = "none";

// Multi-threaded WebAssembly needs an isolated page: sw.js adds the headers, one reload applies them.
async function isolate() {
  if (crossOriginIsolated || !("serviceWorker" in navigator) || qs.get("nosw")) return;
  try {
    await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    if (!sessionStorage.getItem("lens.reloaded")) {
      sessionStorage.setItem("lens.reloaded", "1");
      location.reload();
      await new Promise(() => {});
    }
  } catch (e) { console.warn("service worker unavailable; WASM will use one thread", e); }
}

requestAnimationFrame(draw);
try {
  await isolate();
  // camera starts on load; ?img=test.jpg swaps in a still image for self-testing
  await (qs.get("img") ? useImage(qs.get("img")) : startCamera());
  [run, state.backend] = await createEngine();
  inferLoop().catch(e => { setStatus("Error: " + e.message); console.error(e); });
} catch (e) { setStatus("Could not start: " + e.message); console.error(e); }
</script>
</body>
